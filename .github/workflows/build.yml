# Builds Rubaxe for Linux, macOS and Windows. Run it from the Actions tab, or push a tag like v0.1.0 to also
# publish the installers in a GitHub Release.
name: Builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # the release job creates the Release and uploads the files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # node-pty has no Linux prebuild: rebuild it here (the runner has python3 and a C++ toolchain).
          - os: ubuntu-latest
            target: --linux AppImage -c.npmRebuild=true
          - os: macos-latest
            target: --mac dmg --x64 --arm64
          - os: windows-latest
            target: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: rubaxe-${{ runner.os }}
          # latest*.yml and the blockmaps: the in-app updater looks the new version up in them on the Release.
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "Rubaxe $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
