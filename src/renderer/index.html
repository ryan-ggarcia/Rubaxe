<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self' blob:">
  <title>Rubaxe</title>
  <link rel="stylesheet" href="../../node_modules/@vscode/codicons/dist/codicon.css">
  <link rel="stylesheet" href="../../node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebar">
    <div id="wc-mac" role="group" aria-label="Controles da janela">
      <button class="wc wc-close" id="wc-close" aria-label="Fechar janela" title="Fechar"><span class="codicon codicon-close"></span></button>
      <button class="wc wc-min" id="wc-min" aria-label="Minimizar janela" title="Minimizar"><span class="codicon codicon-chrome-minimize"></span></button>
      <button class="wc wc-max" id="wc-max" aria-label="Maximizar janela" title="Maximizar"><span class="codicon codicon-chrome-maximize"></span></button>
    </div>
    <button class="tb-btn" id="menu-btn" aria-label="Menu principal" aria-haspopup="menu" aria-expanded="false" title="Menu"><span class="codicon codicon-menu"></span></button>
    <div id="menubar" role="menu" aria-label="Menu principal" hidden></div>
    <div id="brand"><img src="../../assets/logo.png" alt="" width="18" height="18"><span>Rubaxe</span></div>
    <button class="tb-chip" id="folder-btn" aria-label="Abrir pasta" title="Abrir pasta (Ctrl+O)"><span id="folder-label">Abrir pasta</span><span class="codicon codicon-chevron-down"></span></button>
    <button class="tb-chip" id="branch-btn" aria-label="Trocar branch" title="Trocar branch" hidden><span class="codicon codicon-git-branch"></span><span id="branch-label"></span></button>
    <button id="command-center" aria-label="Pesquisar no projeto" title="Ir para arquivo (Ctrl+P)">
      <span class="codicon codicon-search"></span><span id="command-center-label">Pesquisar no projeto...</span>
    </button>
    <div id="titlebar-actions">
      <button class="tb-btn" id="tb-run" aria-label="Executar arquivo" title="Executar arquivo (Ctrl+F5)"><span class="codicon codicon-play"></span></button>
      <button class="tb-btn" id="tb-terminal" aria-label="Alternar terminal" title="Alternar terminal (Ctrl+J)"><span class="codicon codicon-terminal"></span></button>
      <button class="tb-btn" id="tb-right" aria-label="Alternar painel direito" title="Alternar painel direito (Ctrl+Alt+B)"><span class="codicon codicon-layout-sidebar-right"></span></button>
      <button class="tb-btn" id="tb-settings" aria-label="Configurações" title="Configurações (Ctrl+,)"><span class="codicon codicon-settings-gear"></span></button>
    </div>
  </header>

  <div id="main">
    <nav id="activitybar" aria-label="Barra de atividades">
      <div class="ab-item" role="button" tabindex="0" aria-label="Explorer" data-view="explorer" title="Explorer (Ctrl+Shift+E)"><span class="codicon codicon-files"></span></div>
      <div class="ab-item" role="button" tabindex="0" aria-label="Pesquisar" data-view="search" title="Pesquisar (Ctrl+Shift+F)"><span class="codicon codicon-search"></span></div>
      <div class="ab-item" role="button" tabindex="0" aria-label="Controle de Código" data-view="scm" title="Controle de Código (Ctrl+Shift+G)"><span class="codicon codicon-source-control"></span></div>
      <div class="ab-item" role="button" tabindex="0" aria-label="Executar e Depurar" data-view="debug" title="Executar e Depurar (Ctrl+Shift+D)"><span class="codicon codicon-debug-alt"></span></div>
      <div class="ab-item" role="button" tabindex="0" aria-label="Testes" data-view="tests" title="Testes"><span class="codicon codicon-beaker"></span></div>
      <div class="ab-item" role="button" tabindex="0" aria-label="Ruby" data-view="ruby" title="Ruby"><span class="codicon codicon-ruby"></span></div>
      <div class="ab-spacer"></div>
      <div class="ab-item" id="ab-settings" role="button" tabindex="0" aria-label="Configurações" title="Configurações (Ctrl+,)"><span class="codicon codicon-settings-gear"></span></div>
    </nav>

    <aside id="sidebar">
      <section class="view" id="view-explorer">
        <div class="view-header"><span id="explorer-title">EXPLORER</span><span class="view-actions" id="explorer-actions"></span></div>
        <div class="view-body" id="explorer-tree"></div>
        <div class="empty" id="explorer-empty">
          <p>Nenhuma pasta aberta.</p>
          <button class="button" id="explorer-empty-open">Abrir pasta</button>
        </div>
        <div class="section-header" id="outline-header"><span class="codicon codicon-chevron-down"></span>ESTRUTURA</div>
        <div class="view-body outline" id="outline"></div>
      </section>
      <section class="view" id="view-search" hidden>
        <div class="view-header"><span>PESQUISAR</span></div>
        <div class="search-box">
          <input class="input" id="search-input" placeholder="Pesquisar (Enter)" spellcheck="false">
          <span class="codicon codicon-case-sensitive toggle" id="search-case" title="Diferenciar maiúsculas"></span>
          <span class="codicon codicon-regex toggle" id="search-regex" title="Expressão regular"></span>
        </div>
        <div class="view-body" id="search-results"></div>
      </section>
      <section class="view" id="view-scm" hidden>
        <div class="view-header"><span>GIT</span><span class="view-actions" id="scm-actions"></span></div>
        <div class="scm-commit"><textarea class="input" id="scm-message" rows="3" placeholder="Mensagem do commit (Ctrl+Enter)" spellcheck="false"></textarea></div>
        <div class="view-body" id="scm-body"></div>
      </section>
      <section class="view" id="view-debug" hidden>
        <div class="view-header"><span>EXECUTAR E DEPURAR</span><span class="view-actions" id="debug-actions"></span></div>
        <div class="section-header">VARIÁVEIS</div>
        <div class="view-body debug-section" id="debug-vars"></div>
        <div class="section-header">INSPEÇÃO<span class="spacer"></span><span class="codicon codicon-add" id="debug-watch-add" title="Adicionar expressão"></span></div>
        <div class="view-body debug-section" id="debug-watch"></div>
        <div class="section-header">PILHA DE CHAMADAS</div>
        <div class="view-body debug-section" id="debug-stack"></div>
        <div class="section-header">BREAKPOINTS</div>
        <div class="view-body debug-section" id="debug-bps"></div>
      </section>
      <section class="view" id="view-tests" hidden>
        <div class="view-header"><span>TESTES</span><span class="view-actions" id="tests-actions"></span></div>
        <div class="view-body" id="tests-tree"></div>
      </section>
      <section class="view" id="view-ruby" hidden>
        <div class="view-header"><span>RUBY</span></div>
        <div class="view-body" id="ruby-body"></div>
        <div class="section-header" id="gems-header"><span class="codicon codicon-chevron-down"></span>GEMS<span class="spacer"></span><span class="codicon codicon-refresh" id="gems-refresh" title="Recarregar gems"></span></div>
        <div class="view-body" id="gems-body"></div>
      </section>
    </aside>
    <div class="sash vertical" id="sash-side"></div>

    <div id="workbench">
      <div id="editor-card">
      <div id="tabs" hidden></div>
      <div id="editor-area">
        <div id="editor" hidden></div>
        <div id="diff-editor" hidden></div>
        <div id="settings-page" hidden></div>
        <div id="welcome"></div>
      </div>
      </div>
      <div class="sash horizontal" id="sash-panel"></div>
      <section id="panel">
        <div class="panel-header">
          <div class="panel-tab" data-panel="problems">PROBLEMAS <span class="badge" id="problems-count"></span></div>
          <div class="panel-tab" data-panel="output">SAÍDA</div>
          <div class="panel-tab" data-panel="debug">CONSOLE DE DEPURAÇÃO</div>
          <div class="panel-tab" data-panel="terminal">TERMINAL</div>
          <span class="spacer"></span>
          <span class="terminal-actions" id="terminal-actions" hidden>
            <select class="input" id="terminal-select" title="Terminais"></select>
            <span class="codicon codicon-add" id="terminal-new" title="Novo terminal (Ctrl+Shift+`)"></span>
            <span class="codicon codicon-chevron-down" id="terminal-profiles" title="Perfis de terminal"></span>
            <span class="codicon codicon-trash" id="terminal-kill" title="Encerrar terminal"></span>
          </span>
          <span class="codicon codicon-debug-stop disabled" id="panel-stop" title="Parar (Shift+F2)"></span>
          <span class="codicon codicon-clear-all" id="panel-clear" title="Limpar saída"></span>
          <span class="codicon codicon-close" id="panel-close" title="Fechar painel (Ctrl+J)"></span>
        </div>
        <div class="panel-body" id="panel-problems"></div>
        <pre class="panel-body" id="panel-output" hidden></pre>
        <input class="input" id="output-input" placeholder="Entrada do programa (Enter envia)" spellcheck="false" hidden>
        <div class="panel-body" id="panel-terminal" hidden><div id="terminal-host"></div></div>
        <div class="panel-body" id="panel-debug" hidden>
          <pre id="debug-console"></pre>
          <input class="input" id="debug-input" placeholder="Avaliar expressão Ruby no frame selecionado (Enter)" spellcheck="false">
        </div>
      </section>
    </div>
    <aside id="rightpanel" aria-label="Painel direito"></aside>
  </div>

  <footer id="statusbar"><div id="sb-left"></div><div id="sb-right"></div></footer>
  <div id="quick-input" hidden></div>
  <div id="toasts"></div>

  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="../../dist/renderer.js"></script>
</body>
</html>
